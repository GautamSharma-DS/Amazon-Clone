
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Amazon.in</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #fff;
            color: #111;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 13px;
        }

        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Amazon.in-style wordmark */
        
        .logo {
            margin: 18px auto 20px;
            text-align: center;
        }

        .logo a {
            display: inline-flex;
            align-items: flex-start;
            justify-content: center;
            text-decoration: none;
            color: #111;
        }

        .logo img {
            display: block;
            width: 160px;
            height: auto;
            filter: invert(1);
        }

        .logo-in {
            position: absolute;
            right: -18px;
            top: 32px;
            color: #111;
            font-size: 14px;
            font-weight: 400;
        }

        .brand-name {
            font-size: 35px;
            font-weight: 700;
            letter-spacing: -1.5px;
            line-height: 36px;
            white-space: nowrap;
        }

        .brand-name .in {
            font-size: 17px;
            font-weight: 400;
            letter-spacing: 0;
        }

        .smile {
            width: 75px;
            height: 13px;
            margin-top: -1px;
        }

        /* Sign-in box */
        .signin-card {
            width: 350px;
            max-width: calc(100% - 24px);
            padding: 22px 26px 24px;
            border: 1px solid #d5d9d9;
            border-radius: 8px;
            background: #fff;
        }

        h1 {
            margin: 0 0 22px;
            font-size: 28px;
            font-weight: 400;
            line-height: 1.2;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 700;
        }

        input {
            width: 100%;
            height: 38px;
            padding: 7px 10px;
            border: 1px solid #888c8c;
            border-radius: 4px;
            background: #fff;
            color: #111;
            font-family: inherit;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #007185;
            box-shadow: 0 0 3px 2px rgba(0, 113, 133, 0.2);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 66px;
        }

        .toggle-password {
            position: absolute;
            top: 0;
            right: 7px;
            height: 38px;
            border: 0;
            background: transparent;
            color: #0066c0;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .toggle-password:hover {
            text-decoration: underline;
            color: #c45500;
        }

        .signin-button {
            width: 100%;
            height: 38px;
            margin: 3px 0 18px;
            border: 1px solid #fcd200;
            border-radius: 20px;
            background: #ffd814;
            color: #111;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
        }

        .signin-button:hover {
            background: #f7ca00;
        }

        .signin-button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .terms {
            margin: 0 0 20px;
            font-size: 12px;
            line-height: 1.55;
        }

        a.text-link {
            color: #0066c0;
            text-decoration: none;
        }

        a.text-link:hover {
            color: #c45500;
            text-decoration: underline;
        }

        .help-link {
            display: inline-block;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .divider {
            border: 0;
            border-top: 1px solid #e7e7e7;
            margin: 0 0 19px;
        }

        .business-title {
            margin: 0 0 7px;
            font-size: 13px;
            font-weight: 700;
        }

        .business-link {
            font-size: 13px;
        }

        /* Create-account separator */
        .new-customer {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 350px;
            max-width: calc(100% - 24px);
            margin: 23px 0 12px;
            color: #767676;
            font-size: 12px;
            text-align: center;
        }

        .new-customer::before,
        .new-customer::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e7e7e7;
        }

        .create-account-button {
            display: block;
            width: 350px;
            max-width: calc(100% - 24px);
            min-height: 35px;
            padding: 8px 12px;
            border: 1px solid #adb1b8;
            border-radius: 20px;
            background: #fff;
            color: #111;
            font-family: inherit;
            font-size: 13px;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
        }

        .create-account-button:hover {
            background: #f7fafa;
        }

        /* Status messages */
        .message {
            display: none;
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 4px;
            font-size: 12px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .message.error {
            display: block;
            border: 1px solid #c40000;
            color: #b12704;
            background: #fff8f8;
        }

        .message.success {
            display: block;
            border: 1px solid #a6d8c8;
            color: #067d62;
            background: #f3fffa;
        }

        /* Footer */
        .footer {
            width: 100%;
            margin-top: 28px;
            padding: 24px 12px 20px;
            border-top: 1px solid #e7e7e7;
            background: linear-gradient(to bottom, #fff, #fafafa);
            text-align: center;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 26px;
            margin-bottom: 17px;
        }

        .footer-links a {
            color: #0066c0;
            font-size: 11px;
            text-decoration: none;
        }

        .footer-links a:hover {
            text-decoration: underline;
            color: #c45500;
        }

        .copyright {
            margin: 0;
            color: #565959;
            font-size: 11px;
        }

        @media (max-width: 400px) {
            .signin-card {
                padding: 21px 20px 22px;
            }

            .footer-links {
                gap: 15px;
            }
        }
    </style>
</head>

<body>
    <div class="page">

        <div class="logo">
            <a href="index.html" aria-label="Amazon.in home">
                <img src="amazon_logo.png" alt="Amazon">
                <span class="logo-in">.in</span>
            </a>
        </div>

        <main class="signin-card">
            <h1>Sign in</h1>

            <div id="message"
                 class="message"
                 role="alert"
                 aria-live="polite"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email or mobile phone number</label>
                    <input
                        type="text"
                        id="email"
                        name="email"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            id="togglePassword"
                            aria-label="Show password"
                        >
                            Show
                        </button>
                    </div>
                </div>

                <button
                    type="submit"
                    class="signin-button"
                    id="signinButton"
                >
                    Sign in
                </button>
            </form>

            <p class="terms">
                By continuing, you agree to Amazon's
                <a href="#" class="text-link">Conditions of Use</a>
                and
                <a href="#" class="text-link">Privacy Notice</a>.
            </p>

            <a href="#" class="text-link help-link" id="helpLink">
                ▸ Need help?
            </a>

            <hr class="divider">

            <p class="business-title">Buying for work?</p>

            <a href="#" class="text-link business-link" id="businessLink">
                Shop on Amazon Business
            </a>
        </main>

        <div class="new-customer">
            New to Amazon?
        </div>

        <a href="signup.html" class="create-account-button">
            Create your Amazon account
        </a>

        <footer class="footer">
            <div class="footer-links">
                <a href="#" class="text-link">Conditions of Use</a>
                <a href="#" class="text-link">Privacy Notice</a>
                <a href="#" class="text-link" id="footerHelp">Help</a>
            </div>

            <p class="copyright">
                © 1996-2026, Amazon.com, Inc. or its affiliates
            </p>
        </footer>

    </div>

    <script>
        const API_BASE_URL = "http://127.0.0.1:8000";

        const loginForm = document.getElementById("loginForm");
        const messageBox = document.getElementById("message");
        const signinButton = document.getElementById("signinButton");
        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");

        function showMessage(message, type) {
            messageBox.textContent = message;
            messageBox.className = "message " + type;
        }

        togglePassword.addEventListener("click", function () {
            const isPassword = passwordInput.type === "password";

            passwordInput.type = isPassword ? "text" : "password";
            togglePassword.textContent = isPassword ? "Hide" : "Show";

            togglePassword.setAttribute(
                "aria-label",
                isPassword ? "Hide password" : "Show password"
            );
        });

        loginForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                showMessage("Enter your email and password.", "error");
                return;
            }

            signinButton.disabled = true;
            signinButton.textContent = "Signing in...";
            messageBox.className = "message";
            messageBox.textContent = "";

            try {
                /*
                 * The current FastAPI login endpoint accepts email
                 * and password as query parameters.
                 */
                const params = new URLSearchParams({
                    email: email,
                    password: password
                });

                const response = await fetch(
                    `${API_BASE_URL}/auth/login?${params.toString()}`,
                    {
                        method: "POST",
                        headers: {
                            "Accept": "application/json"
                        }
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        typeof data.detail === "string"
                            ? data.detail
                            : "Sign-in failed. Check your credentials."
                    );
                }

                if (!data.access_token) {
                    throw new Error("The server did not return a login token.");
                }

                localStorage.setItem("access_token", data.access_token);

                showMessage(
                    "Sign-in successful! Redirecting...",
                    "success"
                );

                window.setTimeout(function () {
                    window.location.href = "index.html";
                }, 700);

            } catch (error) {
                if (error instanceof TypeError) {
                    showMessage(
                        "Cannot connect to the server. Start the FastAPI backend and try again.",
                        "error"
                    );
                } else {
                    showMessage(error.message, "error");
                }
            } finally {
                signinButton.disabled = false;
                signinButton.textContent = "Sign in";
            }
        });

        document.getElementById("helpLink").addEventListener(
            "click",
            function (event) {
                event.preventDefault();
                showMessage(
                    "If you cannot sign in, check your email and password. Password reset is not configured yet.",
                    "error"
                );
            }
        );

        document.getElementById("footerHelp").addEventListener(
            "click",
            function (event) {
                event.preventDefault();
                showMessage(
                    "For this project, sign-in support is available on this page. Password reset is not configured yet.",
                    "error"
                );
                window.scrollTo({ top: 0, behavior: "smooth" });
            }
        );

        document.getElementById("businessLink").addEventListener(
            "click",
            function (event) {
                event.preventDefault();
                showMessage(
                    "Amazon Business registration is not configured in this project yet.",
                    "error"
                );
            }
        );
    </script>
</body>
</html>
