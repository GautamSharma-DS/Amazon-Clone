<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Amazon Cart</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="cart-page">


    <!-- ==============================
         CART HEADER
    =============================== -->

    <header class="cart-header">

        <a
            href="index.html"
            class="cart-logo"
        >
            amazon
        </a>


        <div class="cart-header-title">

            <i class="fa-solid fa-cart-shopping"></i>

            Shopping Cart

        </div>

    </header>



    <!-- ==============================
         MAIN CART AREA
    =============================== -->

    <main class="cart-main">


        <!-- CART ITEMS -->

        <section id="cartContainer">

        </section>



        <!-- CART SUMMARY -->

        <aside id="cartSummary">

        </aside>


    </main>



    <!-- ==============================
         BACK TO SHOPPING
    =============================== -->

    <div class="cart-back">

        <a href="index.html">

            <i class="fa-solid fa-arrow-left"></i>

            Continue Shopping

        </a>

    </div>



    <!-- ==============================
         FOOTER
    =============================== -->

    <footer class="cart-footer">

        <p>
            © 2026 Amazon Clone | Built for learning and portfolio purposes
        </p>

    </footer>



    <script src="script.js"></script>

</body>

</html>
